name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3

      - run: npm install
      - run: python build_web.py
      - run: npx cap add android
      - run: python scripts/patch_android.py
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/calculator.apk
          cp release-assets/calculator.apk calculator.apk
          python scripts/verify_apk.py release-assets/calculator.apk

      - uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: calculator.apk

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-assets/calculator.apk
          git diff --staged --quiet || git commit -m "Add calculator.apk"
          git push
