[build]
  command = "python build_web.py"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.12"

[[redirects]]
  from = "/install/"
  to = "/install.html"
  status = 200

[[headers]]
  for = "/*.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"

[[headers]]
  for = "/js/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
