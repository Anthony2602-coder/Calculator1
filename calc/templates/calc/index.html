{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#6366f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CalcPro">
  <meta name="description" content="Beautiful offline calculator for iOS and Android">
  <title>CalcPro</title>
  <link rel="manifest" href="{% static 'manifest.json' %}">
  <link rel="icon" href="{% static 'icons/icon-192.png' %}">
  <link rel="apple-touch-icon" href="{% static 'icons/icon-192.png' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <div class="bg-glow"></div>
  <main class="shell">
    <header class="top">
      <div class="brand">
        <span class="brand-dot"></span>
        <h1>CalcPro</h1>
      </div>
      <button type="button" id="modeBtn" class="chip">Standard</button>
    </header>

    <section class="calc-card" aria-label="Calculator">
      <div class="display">
        <p id="expr" class="expr"></p>
        <p id="result" class="result">0</p>
      </div>

      <div id="sciPad" class="grid sci hidden">
        <button type="button" data-fn="sin">sin</button>
        <button type="button" data-fn="cos">cos</button>
        <button type="button" data-fn="tan">tan</button>
        <button type="button" data-fn="log">log</button>
        <button type="button" data-fn="sqrt">√</button>
        <button type="button" data-const="pi">π</button>
        <button type="button" data-const="e">e</button>
        <button type="button" data-op="^">xʸ</button>
      </div>

      <div class="grid keys">
        <button type="button" class="key fn" data-action="clear">AC</button>
        <button type="button" class="key fn" data-action="sign">±</button>
        <button type="button" class="key fn" data-action="percent">%</button>
        <button type="button" class="key op" data-op="/">÷</button>

        <button type="button" class="key" data-num="7">7</button>
        <button type="button" class="key" data-num="8">8</button>
        <button type="button" class="key" data-num="9">9</button>
        <button type="button" class="key op" data-op="*">×</button>

        <button type="button" class="key" data-num="4">4</button>
        <button type="button" class="key" data-num="5">5</button>
        <button type="button" class="key" data-num="6">6</button>
        <button type="button" class="key op" data-op="-">−</button>

        <button type="button" class="key" data-num="1">1</button>
        <button type="button" class="key" data-num="2">2</button>
        <button type="button" class="key" data-num="3">3</button>
        <button type="button" class="key op" data-op="+">+</button>

        <button type="button" class="key wide" data-num="0">0</button>
        <button type="button" class="key" data-action="dot">.</button>
        <button type="button" class="key eq" data-action="equals">=</button>
      </div>

      <button type="button" id="backBtn" class="back" aria-label="Backspace">⌫</button>
    </section>

    <footer class="bottom">
      <span>Works offline</span>
      <a href="{% url 'install' %}">Install Android APK</a>
    </footer>
  </main>

  <script src="{% static 'js/calculator.js' %}" defer></script>
  <script src="{% static 'js/app.js' %}" defer></script>
</body>
</html>
